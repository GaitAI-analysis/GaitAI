name: Deploy to GitHub Pages

on:
  push:
    branches:
      - v1/feature/insights
  workflow_dispatch:

# Allow the workflow to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; cancel stale runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Gate the deploy on the checks that used to run only on a developer's
      # machine, if at all: types, lint, and GaitAI data integrity (duplicate
      # ids, broken product/capability/publication references, unroutable
      # links). A data error now fails CI instead of rendering a wrong count
      # in production.
      - name: Verify (typecheck, lint, data integrity)
        run: npm run verify

      # The assistant answers only from the generated corpus, so a data change
      # that breaks retrieval is a content bug the same as a broken product
      # reference. This regenerates the corpus and runs the 25-question
      # acceptance suite against the SAME modules the browser AND the Cloud
      # Function run — retrieval, the link allowlist and the extractive answer.
      # No token, no network call: the assistant's floor is deterministic, so
      # what a visitor reads when the hosted model is unavailable is fully
      # assertable here. The Cloudflare Worker (worker/) imports the same
      # modules; it is typechecked and its tests run against a mocked provider.
      # It is deployed separately (`wrangler deploy`, from worker/) by someone
      # holding the Cloudflare account — never from this workflow.
      - name: Verify Ask GaitAI
        run: |
          npm run build:knowledge
          npm run ask:test
          cd worker && npm ci && npm run typecheck && npm test

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # Firebase client config comes from GitHub Actions secrets — the values
      # are never committed to the repo. Add them under:
      # Repo → Settings → Secrets and variables → Actions → New repository secret
      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}

      # Next.js emits assets under out/_next. GitHub Pages runs Jekyll by
      # default, which ignores any path beginning with "_". The .nojekyll file
      # disables Jekyll so those CSS/JS chunks are served instead of 404-ing.
      - name: Disable Jekyll
        run: touch out/.nojekyll

      # Preserve the custom domain on every deploy.
      - name: Add CNAME
        run: echo "gaitai.in" > out/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
