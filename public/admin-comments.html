<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Comment Moderation · GaitAI</title>
  <link rel="icon" href="/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      --bg: #070b14;
      --bg-elev: #0e1322;
      --card-a: rgba(17, 24, 39, 0.72);
      --card-b: rgba(11, 17, 30, 0.72);
      --border: rgba(148, 163, 184, 0.12);
      --border-strong: rgba(148, 163, 184, 0.22);
      --white: #f8fafc;
      --gray: #cbd5e1;
      --mute: #94a3b8;
      --royal: #2563ff;
      --violet: #7c3aed;
      --cyan: #4fd1ff;
      --emerald: #34d399;
      --amber: #fbbf24;
      --rose: #fb7185;
      --radius: 16px;
      --shadow-card: 0 1px 0 0 rgba(255,255,255,0.04) inset, 0 30px 60px -30px rgba(0,0,0,0.6);
    }
    * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--white); }
    body {
      font-family: "Inter", system-ui, sans-serif;
      min-height: 100vh;
      background-image:
        radial-gradient(at 15% 0%, rgba(37,99,255,0.14) 0px, transparent 45%),
        radial-gradient(at 85% 5%, rgba(124,58,237,0.12) 0px, transparent 45%);
    }
    h1, h2, h3, .display { font-family: "Space Grotesk", system-ui, sans-serif; letter-spacing: -0.02em; }
    a { color: var(--cyan); text-decoration: none; }
    button { font-family: inherit; cursor: pointer; }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: linear-gradient(180deg, var(--royal), var(--violet)); border-radius: 999px; border: 2px solid var(--bg); }

    .wrap { max-width: 1240px; margin: 0 auto; padding: 0 20px; }
    .card {
      position: relative; border-radius: var(--radius);
      background: linear-gradient(180deg, var(--card-a), var(--card-b));
      border: 1px solid var(--border); box-shadow: var(--shadow-card);
    }
    .muted { color: var(--mute); }
    .gray { color: var(--gray); }

    /* Buttons */
    .btn {
      display: inline-flex; align-items: center; gap: 8px; justify-content: center;
      border-radius: 999px; padding: 9px 16px; font-size: 13px; font-weight: 500;
      border: 1px solid transparent; transition: all .2s ease; color: var(--white);
      background: transparent; white-space: nowrap;
    }
    .btn:disabled { opacity: .55; cursor: not-allowed; }
    .btn-primary {
      background: linear-gradient(135deg, var(--royal), var(--violet)); color: #fff;
      box-shadow: 0 10px 30px -12px rgba(37,99,255,0.6);
    }
    .btn-primary:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 16px 36px -12px rgba(37,99,255,0.7); }
    .btn-ghost { background: rgba(255,255,255,0.04); border-color: var(--border); color: var(--gray); }
    .btn-ghost:hover:not(:disabled) { border-color: var(--border-strong); color: var(--white); }
    .btn-emerald { background: rgba(52,211,153,0.12); color: #6ee7b7; border-color: rgba(52,211,153,0.3); }
    .btn-emerald:hover:not(:disabled) { background: rgba(52,211,153,0.22); }
    .btn-rose { background: rgba(251,113,133,0.12); color: #fda4af; border-color: rgba(251,113,133,0.3); }
    .btn-rose:hover:not(:disabled) { background: rgba(251,113,133,0.22); }
    .btn-sm { padding: 6px 12px; font-size: 12px; }
    .icon-btn { padding: 7px; border-radius: 10px; background: rgba(255,255,255,0.04); border: 1px solid var(--border); color: var(--mute); }
    .icon-btn:hover { color: var(--white); border-color: var(--border-strong); }

    /* Badges */
    .badge {
      display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px;
      border-radius: 999px; font-size: 11px; font-weight: 600; letter-spacing: .03em;
      text-transform: uppercase; border: 1px solid transparent;
    }
    .badge .dot { width: 6px; height: 6px; border-radius: 999px; background: currentColor; }
    .b-pending { color: var(--amber); background: rgba(251,191,36,0.1); border-color: rgba(251,191,36,0.28); }
    .b-approved { color: var(--emerald); background: rgba(52,211,153,0.1); border-color: rgba(52,211,153,0.28); }
    .b-rejected { color: var(--rose); background: rgba(251,113,133,0.1); border-color: rgba(251,113,133,0.28); }
    .b-type { color: var(--cyan); background: rgba(79,209,255,0.08); border-color: rgba(79,209,255,0.25); text-transform: capitalize; }

    /* Inputs */
    .field {
      width: 100%; border-radius: 12px; border: 1px solid var(--border);
      background: rgba(255,255,255,0.03); padding: 9px 12px; color: var(--white);
      font-size: 13px; outline: none; transition: all .2s ease;
    }
    .field:focus { border-color: rgba(79,209,255,0.4); box-shadow: 0 0 0 3px rgba(79,209,255,0.12); }
    select.field { appearance: none; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' fill='none' stroke='%2394a3b8' stroke-width='2'><path d='M4 6l4 4 4-4'/></svg>"); background-repeat: no-repeat; background-position: right 10px center; padding-right: 30px; }
    label.lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--mute); display: block; margin-bottom: 6px; }

    /* Header */
    .topbar { position: sticky; top: 0; z-index: 30; backdrop-filter: blur(16px); background: rgba(7,11,20,0.72); border-bottom: 1px solid var(--border); }
    .topbar-inner { display: flex; align-items: center; justify-content: space-between; height: 64px; gap: 16px; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand .mark { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; background: linear-gradient(135deg, rgba(37,99,255,0.3), rgba(124,58,237,0.2)); border: 1px solid var(--border); color: var(--cyan); }
    .who { display: flex; align-items: center; gap: 10px; }
    .avatar { width: 30px; height: 30px; border-radius: 999px; background: linear-gradient(135deg, var(--cyan), var(--royal)); display: grid; place-items: center; font-size: 12px; font-weight: 700; color: #04121f; }

    /* Tabs */
    .tabs { display: inline-flex; gap: 4px; padding: 4px; border-radius: 999px; background: rgba(255,255,255,0.03); border: 1px solid var(--border); }
    .tab { border-radius: 999px; padding: 7px 16px; font-size: 13px; font-weight: 500; color: var(--mute); background: transparent; border: none; }
    .tab.active { background: linear-gradient(135deg, rgba(37,99,255,0.25), rgba(124,58,237,0.18)); color: var(--white); }
    .tab .count { margin-left: 7px; font-size: 11px; padding: 1px 7px; border-radius: 999px; background: rgba(255,255,255,0.08); }

    /* Stats */
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    .stat { padding: 16px; }
    .stat .n { font-family: "Space Grotesk"; font-size: 26px; font-weight: 600; }
    .stat .l { font-size: 12px; color: var(--mute); margin-top: 2px; }

    /* Filters */
    .filters { display: grid; grid-template-columns: 1.4fr repeat(3, 1fr) auto; gap: 10px; align-items: end; }

    /* Table */
    .tbl-card { overflow: hidden; }
    table { width: 100%; border-collapse: collapse; }
    thead th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--mute); font-weight: 600; padding: 12px 16px; border-bottom: 1px solid var(--border); background: rgba(255,255,255,0.015); }
    tbody td { padding: 14px 16px; border-bottom: 1px solid var(--border); vertical-align: top; font-size: 13px; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr { transition: background .15s ease; }
    tbody tr:hover { background: rgba(255,255,255,0.02); }
    tbody tr.sel { background: rgba(37,99,255,0.07); }
    .cmt-author { display: flex; align-items: center; gap: 10px; }
    .cmt-author .av { width: 32px; height: 32px; border-radius: 999px; display: grid; place-items: center; font-size: 11px; font-weight: 700; background: linear-gradient(135deg, rgba(79,209,255,0.25), rgba(37,99,255,0.18)); color: var(--cyan); border: 1px solid var(--border); flex-shrink: 0; }
    .cmt-author .nm { font-weight: 600; color: var(--white); }
    .cmt-author .em { font-size: 11px; color: var(--mute); }
    .cmt-msg { color: var(--gray); line-height: 1.55; max-width: 460px; white-space: pre-wrap; word-break: break-word; }
    .reply-tag { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: var(--violet); margin-bottom: 4px; }
    .row-actions { display: flex; gap: 6px; justify-content: flex-end; flex-wrap: wrap; }
    .checkbox { width: 17px; height: 17px; border-radius: 5px; border: 1.5px solid var(--border-strong); background: rgba(255,255,255,0.03); display: inline-grid; place-items: center; cursor: pointer; flex-shrink: 0; transition: all .15s ease; }
    .checkbox.on { background: linear-gradient(135deg, var(--royal), var(--violet)); border-color: transparent; }
    .checkbox svg { opacity: 0; }
    .checkbox.on svg { opacity: 1; }

    /* Bulk bar */
    .bulkbar { position: sticky; bottom: 18px; z-index: 25; display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 12px 16px; margin-top: 16px; }
    .bulkbar.hidden { display: none; }

    /* Cards (mobile) */
    .mcards { display: none; }
    .mcard { padding: 16px; margin-bottom: 12px; }

    /* States */
    .state { text-align: center; padding: 64px 24px; }
    .state .ic { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; margin: 0 auto 14px; background: rgba(255,255,255,0.04); border: 1px solid var(--border); color: var(--mute); }
    .spinner { width: 34px; height: 34px; border-radius: 999px; border: 3px solid rgba(255,255,255,0.12); border-top-color: var(--cyan); animation: spin .8s linear infinite; margin: 0 auto; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Sign-in */
    .signin-wrap { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    .signin { max-width: 420px; width: 100%; padding: 40px 32px; text-align: center; }
    .signin .mark { width: 56px; height: 56px; border-radius: 18px; margin: 0 auto 20px; display: grid; place-items: center; background: linear-gradient(135deg, rgba(37,99,255,0.3), rgba(124,58,237,0.2)); border: 1px solid var(--border); color: var(--cyan); }

    .hr { height: 1px; background: linear-gradient(90deg, transparent, var(--border-strong), transparent); margin: 22px 0; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

    @media (max-width: 860px) {
      .stats { grid-template-columns: repeat(2, 1fr); }
      .filters { grid-template-columns: 1fr 1fr; }
      .tbl-card table { display: none; }
      .mcards { display: block; }
    }

    /* Toast */
    #toasts { position: fixed; right: 20px; bottom: 20px; z-index: 60; display: flex; flex-direction: column; gap: 10px; align-items: flex-end; }
    .toast { display: flex; align-items: center; gap: 10px; padding: 12px 16px; max-width: 360px; animation: pop .25s ease; }
    @keyframes pop { from { opacity: 0; transform: translateY(10px); } }
  </style>
</head>
<body>
  <div id="root">
    <div class="signin-wrap"><div class="spinner"></div></div>
  </div>
  <div id="toasts"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
    import {
      getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";
    import {
      getFirestore, collection, doc, getDocs, setDoc, deleteDoc,
      writeBatch, query, orderBy, onSnapshot, serverTimestamp, getDoc
    } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";

    /* ---- Public client config (safe to ship; not a secret) -------------- */
    const firebaseConfig = {
      apiKey: "AIzaSyBvQFrPJPgGkizJC-loZjeEIZemAKA-eYw",
      authDomain: "gaitai-33c7f.firebaseapp.com",
      projectId: "gaitai-33c7f",
      storageBucket: "gaitai-33c7f.firebasestorage.app",
      messagingSenderId: "52857173308",
      appId: "1:52857173308:web:9ecefc164e3f6eea91da39",
    };

    /* The ONLY account allowed to moderate. Mirrors firestore.rules. */
    const ADMIN_EMAILS = ["anubhaparashar1025@gmail.com"];
    const isAdmin = (email) => !!email && ADMIN_EMAILS.includes(email.toLowerCase());

    const CONTENT_TYPES = ["research","announcement","documentation","approval","blog","demo"];

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();
    provider.setCustomParameters({ prompt: "select_account" });

    /* ---- State ----------------------------------------------------------- */
    const state = {
      user: null,
      authResolved: false,
      tab: "queue",
      entries: [],      // pendingCommentQueue docs (full payload)
      reports: [],      // reportedComments docs
      loadingData: true,
      dataError: null,
      selected: new Set(),
      filters: { post: "", type: "", status: "pending", from: "", to: "", search: "" },
    };
    let unsubQueue = null, unsubReports = null;

    /* ---- Helpers --------------------------------------------------------- */
    const $ = (sel, el = document) => el.querySelector(sel);
    const root = $("#root");
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => (
      { "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]
    ));
    const initials = (name) => {
      const p = String(name||"").trim().split(/\s+/).filter(Boolean);
      if (!p.length) return "?";
      if (p.length === 1) return p[0].slice(0,2).toUpperCase();
      return (p[0][0]+p[p.length-1][0]).toUpperCase();
    };
    const toIso = (v) => v && typeof v.toDate === "function" ? v.toDate().toISOString() : (v || null);
    const relTime = (iso) => {
      if (!iso) return "";
      const d = Date.now() - new Date(iso).getTime();
      const m = Math.round(d/60000);
      if (m < 1) return "just now";
      if (m < 60) return m+"m ago";
      const h = Math.round(m/60); if (h < 24) return h+"h ago";
      const dd = Math.round(h/24); if (dd < 7) return dd+"d ago";
      return new Date(iso).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});
    };
    const queueKey = (slug, id) => `${slug}__${id}`;

    function toast(text, tone = "info") {
      const colors = { success: "var(--emerald)", error: "var(--rose)", info: "var(--cyan)" };
      const el = document.createElement("div");
      el.className = "toast card";
      el.innerHTML = `<span style="width:7px;height:7px;border-radius:999px;background:${colors[tone]};box-shadow:0 0 10px ${colors[tone]}"></span><span style="font-size:13px;color:var(--gray)">${esc(text)}</span>`;
      $("#toasts").appendChild(el);
      setTimeout(() => { el.style.transition="opacity .3s"; el.style.opacity="0"; setTimeout(()=>el.remove(),300); }, 3600);
    }

    /* ---- Auth ------------------------------------------------------------ */
    onAuthStateChanged(auth, (user) => {
      state.user = user;
      state.authResolved = true;
      if (user && isAdmin(user.email)) {
        startStreams();
      } else {
        stopStreams();
      }
      render();
    });

    async function doSignIn() {
      try { await signInWithPopup(auth, provider); }
      catch (e) { toast("Sign-in was cancelled or failed.", "error"); }
    }
    async function doSignOut() { stopStreams(); await signOut(auth); }

    /* ---- Data streams ---------------------------------------------------- */
    function startStreams() {
      if (unsubQueue) return;
      state.loadingData = true; state.dataError = null;
      const qQueue = query(collection(db, "pendingCommentQueue"), orderBy("createdAt", "desc"));
      unsubQueue = onSnapshot(qQueue, (snap) => {
        state.entries = snap.docs.map((d) => {
          const x = d.data();
          return { _key: d.id, ...x, createdAt: toIso(x.createdAt), approvedAt: toIso(x.approvedAt) };
        });
        state.loadingData = false; render();
      }, (err) => { state.dataError = err.message || "Access denied"; state.loadingData = false; render(); });

      const qReports = query(collection(db, "reportedComments"), orderBy("createdAt", "desc"));
      unsubReports = onSnapshot(qReports, (snap) => {
        state.reports = snap.docs.map((d) => {
          const x = d.data();
          return { _key: d.id, ...x, createdAt: toIso(x.createdAt) };
        });
        render();
      }, () => {});
    }
    function stopStreams() {
      if (unsubQueue) { unsubQueue(); unsubQueue = null; }
      if (unsubReports) { unsubReports(); unsubReports = null; }
      state.entries = []; state.reports = [];
    }

    /* ---- Moderation actions --------------------------------------------- */
    const admin = () => state.user?.email || null;

    async function approveOne(entry) {
      const slug = entry.postId, id = entry.commentId;
      const batch = writeBatch(db);
      const approvedRef = doc(db, `postComments/${slug}/comments/${id}`);
      const pendingRef = doc(db, `pendingComments/${slug}/comments/${id}`);
      const queueRef = doc(db, `pendingCommentQueue/${queueKey(slug, id)}`);
      const meta = { status: "approved", approvedAt: serverTimestamp(), approvedBy: admin() };
      batch.set(approvedRef, {
        commentId: id, postId: slug, contentId: slug, contentType: entry.contentType,
        userName: entry.userName, email: entry.email ?? null, message: entry.message,
        createdAt: entry.createdAt ? new Date(entry.createdAt) : serverTimestamp(),
        parentCommentId: entry.parentCommentId ?? null, userId: entry.userId ?? null, ...meta,
      });
      batch.set(pendingRef, meta, { merge: true });
      batch.set(queueRef, meta, { merge: true });
      await batch.commit();
    }

    async function rejectOne(entry) {
      const slug = entry.postId, id = entry.commentId;
      const batch = writeBatch(db);
      const meta = { status: "rejected", approvedAt: null, approvedBy: admin() };
      batch.set(doc(db, `pendingComments/${slug}/comments/${id}`), meta, { merge: true });
      batch.set(doc(db, `pendingCommentQueue/${queueKey(slug, id)}`), meta, { merge: true });
      // Remove from public surface if it was previously approved.
      batch.delete(doc(db, `postComments/${slug}/comments/${id}`));
      await batch.commit();
    }

    async function deleteOne(entry) {
      const slug = entry.postId, id = entry.commentId;
      const batch = writeBatch(db);
      batch.delete(doc(db, `pendingComments/${slug}/comments/${id}`));
      batch.delete(doc(db, `pendingCommentQueue/${queueKey(slug, id)}`));
      batch.delete(doc(db, `postComments/${slug}/comments/${id}`));
      await batch.commit();
    }

    async function withBusy(fn, okMsg) {
      try { await fn(); if (okMsg) toast(okMsg, "success"); }
      catch (e) { console.error(e); toast(e.message || "Action failed.", "error"); }
    }

    async function bulk(action) {
      const items = state.entries.filter((e) => state.selected.has(e._key));
      if (!items.length) return;
      const verb = action === "approve" ? approveOne : rejectOne;
      let ok = 0;
      for (const it of items) {
        try { await verb(it); ok++; } catch (e) { console.error(e); }
      }
      state.selected.clear();
      toast(`${ok} comment${ok===1?"":"s"} ${action === "approve" ? "approved" : "rejected"}.`, "success");
      render();
    }

    /* ---- Report actions -------------------------------------------------- */
    async function removeReportedComment(rep) {
      await deleteOne({ postId: rep.postId, commentId: rep.commentId });
      await deleteDoc(doc(db, `reportedComments/${rep._key}`));
    }
    async function dismissReport(rep) {
      await setDoc(doc(db, `reportedComments/${rep._key}`), { resolved: true }, { merge: true });
    }

    /* ---- Derived --------------------------------------------------------- */
    function filteredEntries() {
      const f = state.filters;
      const term = f.search.trim().toLowerCase();
      const fromT = f.from ? new Date(f.from + "T00:00:00").getTime() : null;
      const toT = f.to ? new Date(f.to + "T23:59:59").getTime() : null;
      return state.entries.filter((e) => {
        if (f.status && (e.status || "pending") !== f.status) return false;
        if (f.post && e.postId !== f.post) return false;
        if (f.type && e.contentType !== f.type) return false;
        if (fromT || toT) {
          const t = new Date(e.createdAt || 0).getTime();
          if (fromT && t < fromT) return false;
          if (toT && t > toT) return false;
        }
        if (term) {
          const hay = `${e.userName} ${e.email||""} ${e.message}`.toLowerCase();
          if (!hay.includes(term)) return false;
        }
        return true;
      });
    }
    const distinctPosts = () => [...new Set(state.entries.map((e) => e.postId))].sort();
    const counts = () => {
      const c = { pending: 0, approved: 0, rejected: 0 };
      state.entries.forEach((e) => { c[e.status || "pending"] = (c[e.status||"pending"]||0)+1; });
      return c;
    };

    /* ---- Render ---------------------------------------------------------- */
    function render() {
      if (!state.authResolved) return;
      if (!state.user) return renderSignIn();
      if (!isAdmin(state.user.email)) return renderDenied();
      renderDashboard();
    }

    function renderSignIn() {
      root.innerHTML = `
        <div class="signin-wrap">
          <div class="signin card">
            <div class="mark">${icon("shield", 24)}</div>
            <h1 style="font-size:22px;margin:0 0 8px">Comment Moderation</h1>
            <p class="muted" style="font-size:14px;margin:0 0 4px">GaitAI Insights · admin only</p>
            <div class="hr"></div>
            <button class="btn btn-primary" id="signin" style="width:100%;padding:12px">
              ${googleGlyph()} Sign in with Google
            </button>
            <p class="muted" style="font-size:12px;margin-top:16px;line-height:1.5">
              Access is restricted to the GaitAI moderator account and enforced by Firestore security rules.
            </p>
          </div>
        </div>`;
      $("#signin").onclick = doSignIn;
    }

    function renderDenied() {
      root.innerHTML = `
        <div class="signin-wrap">
          <div class="signin card">
            <div class="mark" style="color:var(--rose);background:rgba(251,113,133,0.12)">${icon("lock", 24)}</div>
            <h1 style="font-size:22px;margin:0 0 8px">Access denied</h1>
            <p class="muted" style="font-size:14px;line-height:1.6;margin:0 0 4px">
              <strong style="color:var(--gray)">${esc(state.user.email)}</strong> is not an authorized moderator.
            </p>
            <div class="hr"></div>
            <button class="btn btn-ghost" id="signout" style="width:100%">Sign out</button>
          </div>
        </div>`;
      $("#signout").onclick = doSignOut;
    }

    function renderDashboard() {
      const c = counts();
      const reportsOpen = state.reports.filter((r) => !r.resolved).length;
      root.innerHTML = `
        <div class="topbar">
          <div class="wrap topbar-inner">
            <div class="brand">
              <div class="mark">${icon("chat", 20)}</div>
              <div>
                <div class="display" style="font-size:16px;font-weight:600">Moderation</div>
                <div class="muted" style="font-size:11px">GaitAI Insights</div>
              </div>
            </div>
            <div class="who">
              <div class="avatar">${esc(initials(state.user.displayName || state.user.email))}</div>
              <div style="text-align:right;line-height:1.2">
                <div style="font-size:12px;font-weight:600">${esc(state.user.displayName || "Moderator")}</div>
                <div class="muted" style="font-size:11px">${esc(state.user.email)}</div>
              </div>
              <button class="icon-btn" id="signout" title="Sign out">${icon("logout", 16)}</button>
            </div>
          </div>
        </div>

        <div class="wrap" style="padding-top:24px;padding-bottom:60px">
          <div class="stats" style="margin-bottom:22px">
            ${stat(c.pending, "Pending", "var(--amber)")}
            ${stat(c.approved, "Approved", "var(--emerald)")}
            ${stat(c.rejected, "Rejected", "var(--rose)")}
            ${stat(reportsOpen, "Open reports", "var(--cyan)")}
          </div>

          <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap">
            <div class="tabs">
              <button class="tab ${state.tab==="queue"?"active":""}" data-tab="queue">Queue <span class="count">${c.pending}</span></button>
              <button class="tab ${state.tab==="reports"?"active":""}" data-tab="reports">Reported <span class="count">${reportsOpen}</span></button>
            </div>
          </div>

          <div id="panel"></div>
        </div>`;

      $("#signout").onclick = doSignOut;
      root.querySelectorAll("[data-tab]").forEach((b) => b.onclick = () => { state.tab = b.dataset.tab; state.selected.clear(); render(); });

      if (state.tab === "queue") renderQueuePanel();
      else renderReportsPanel();
    }

    function renderQueuePanel() {
      const panel = $("#panel");
      const f = state.filters;
      const rows = filteredEntries();
      const postOpts = ['<option value="">All posts</option>']
        .concat(distinctPosts().map((p) => `<option value="${esc(p)}" ${f.post===p?"selected":""}>${esc(p)}</option>`)).join("");
      const typeOpts = ['<option value="">All types</option>']
        .concat(CONTENT_TYPES.map((t) => `<option value="${t}" ${f.type===t?"selected":""}>${t}</option>`)).join("");
      const statusOpts = [["pending","Pending"],["approved","Approved"],["rejected","Rejected"],["","All statuses"]]
        .map(([v,l]) => `<option value="${v}" ${f.status===v?"selected":""}>${l}</option>`).join("");

      panel.innerHTML = `
        <div class="card" style="padding:16px;margin-bottom:16px">
          <div class="filters">
            <div><label class="lbl">Search</label><input class="field" id="f-search" placeholder="Name, email or text…" value="${esc(f.search)}"></div>
            <div><label class="lbl">Post</label><select class="field" id="f-post">${postOpts}</select></div>
            <div><label class="lbl">Type</label><select class="field" id="f-type">${typeOpts}</select></div>
            <div><label class="lbl">Status</label><select class="field" id="f-status">${statusOpts}</select></div>
            <button class="btn btn-ghost" id="f-clear" title="Reset filters">${icon("reset",15)} Reset</button>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px">
            <div><label class="lbl">From</label><input type="date" class="field" id="f-from" value="${esc(f.from)}"></div>
            <div><label class="lbl">To</label><input type="date" class="field" id="f-to" value="${esc(f.to)}"></div>
          </div>
        </div>
        <div id="list"></div>
        <div class="bulkbar card ${state.selected.size?"":"hidden"}" id="bulkbar">
          <div style="font-size:13px"><strong>${state.selected.size}</strong> selected</div>
          <div style="display:flex;gap:8px">
            <button class="btn btn-emerald btn-sm" id="bulk-approve">${icon("check",15)} Approve</button>
            <button class="btn btn-rose btn-sm" id="bulk-reject">${icon("x",15)} Reject</button>
            <button class="btn btn-ghost btn-sm" id="bulk-clear">Clear</button>
          </div>
        </div>`;

      // Filter wiring
      const setF = (k, v) => { state.filters[k] = v; renderQueuePanel(); };
      $("#f-search").oninput = (e) => { state.filters.search = e.target.value; renderList(rows, true); };
      $("#f-post").onchange = (e) => setF("post", e.target.value);
      $("#f-type").onchange = (e) => setF("type", e.target.value);
      $("#f-status").onchange = (e) => setF("status", e.target.value);
      $("#f-from").onchange = (e) => setF("from", e.target.value);
      $("#f-to").onchange = (e) => setF("to", e.target.value);
      $("#f-clear").onclick = () => { state.filters = { post:"", type:"", status:"pending", from:"", to:"", search:"" }; renderQueuePanel(); };
      $("#bulk-approve").onclick = () => bulk("approve");
      $("#bulk-reject").onclick = () => bulk("reject");
      $("#bulk-clear").onclick = () => { state.selected.clear(); renderQueuePanel(); };

      renderList(rows);
    }

    function renderList(rowsArg, refilter) {
      const rows = refilter ? filteredEntries() : rowsArg;
      const list = $("#list");
      if (state.loadingData) { list.innerHTML = loadingState(); return; }
      if (state.dataError) { list.innerHTML = errorState(state.dataError); return; }
      if (!rows.length) { list.innerHTML = emptyState("No comments match", "Adjust the filters, or wait for new submissions to arrive."); return; }

      const allSel = rows.every((r) => state.selected.has(r._key));
      const tableRows = rows.map((e) => rowHtml(e)).join("");
      const cards = rows.map((e) => cardHtml(e)).join("");

      list.innerHTML = `
        <div class="card tbl-card">
          <table>
            <thead><tr>
              <th style="width:36px">${checkbox(allSel, "all")}</th>
              <th>Author &amp; comment</th>
              <th style="width:120px">Post</th>
              <th style="width:96px">Status</th>
              <th style="width:84px">When</th>
              <th style="width:200px;text-align:right">Actions</th>
            </tr></thead>
            <tbody>${tableRows}</tbody>
          </table>
          <div class="mcards" style="padding:12px">${cards}</div>
        </div>`;

      wireRows();
    }

    function rowHtml(e) {
      const sel = state.selected.has(e._key);
      return `
        <tr class="${sel?"sel":""}" data-key="${esc(e._key)}">
          <td>${checkbox(sel, e._key)}</td>
          <td>
            <div class="cmt-author">
              <div class="av">${esc(initials(e.userName))}</div>
              <div style="min-width:0">
                <div class="nm">${esc(e.userName)}</div>
                ${e.email ? `<div class="em">${esc(e.email)}</div>` : ""}
              </div>
            </div>
            ${e.parentCommentId ? `<div class="reply-tag" style="margin-top:8px">${icon("reply",13)} reply</div>` : ""}
            <div class="cmt-msg" style="margin-top:8px">${esc(e.message)}</div>
          </td>
          <td><span style="font-size:12px;color:var(--gray);word-break:break-word">${esc(e.postId)}</span><div style="margin-top:6px">${typeBadge(e.contentType)}</div></td>
          <td>${statusBadge(e.status)}</td>
          <td><span class="muted" style="font-size:12px" title="${esc(e.createdAt||"")}">${relTime(e.createdAt)}</span></td>
          <td>${rowActions(e)}</td>
        </tr>`;
    }

    function cardHtml(e) {
      const sel = state.selected.has(e._key);
      return `
        <div class="mcard card ${sel?"sel":""}" data-key="${esc(e._key)}" style="${sel?"border-color:rgba(37,99,255,0.4)":""}">
          <div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start">
            <div class="cmt-author">
              <div class="av">${esc(initials(e.userName))}</div>
              <div><div class="nm">${esc(e.userName)}</div>${e.email?`<div class="em">${esc(e.email)}</div>`:""}</div>
            </div>
            ${checkbox(sel, e._key)}
          </div>
          ${e.parentCommentId ? `<div class="reply-tag" style="margin-top:10px">${icon("reply",13)} reply</div>` : ""}
          <div class="cmt-msg" style="margin-top:10px">${esc(e.message)}</div>
          <div style="display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap">
            ${statusBadge(e.status)} ${typeBadge(e.contentType)}
            <span class="muted" style="font-size:11px">${relTime(e.createdAt)}</span>
          </div>
          <div style="font-size:11px;color:var(--mute);margin-top:8px;word-break:break-word">${esc(e.postId)}</div>
          <div style="margin-top:12px">${rowActions(e)}</div>
        </div>`;
    }

    function rowActions(e) {
      const status = e.status || "pending";
      const approve = status !== "approved" ? `<button class="btn btn-emerald btn-sm" data-act="approve" data-key="${esc(e._key)}">${icon("check",14)} Approve</button>` : "";
      const reject = status !== "rejected" ? `<button class="btn btn-rose btn-sm" data-act="reject" data-key="${esc(e._key)}">${icon("x",14)} Reject</button>` : "";
      const del = `<button class="icon-btn" data-act="delete" data-key="${esc(e._key)}" title="Delete permanently">${icon("trash",15)}</button>`;
      return `<div class="row-actions">${approve}${reject}${del}</div>`;
    }

    function wireRows() {
      const byKey = (k) => state.entries.find((e) => e._key === k);
      root.querySelectorAll('.checkbox[data-key]').forEach((cb) => {
        cb.onclick = (ev) => {
          ev.stopPropagation();
          const k = cb.dataset.key;
          if (k === "all") {
            const rows = filteredEntries();
            const allSel = rows.every((r) => state.selected.has(r._key));
            rows.forEach((r) => allSel ? state.selected.delete(r._key) : state.selected.add(r._key));
          } else {
            state.selected.has(k) ? state.selected.delete(k) : state.selected.add(k);
          }
          renderQueuePanel();
        };
      });
      root.querySelectorAll('[data-act]').forEach((b) => {
        b.onclick = async (ev) => {
          ev.stopPropagation();
          const e = byKey(b.dataset.key); if (!e) return;
          const act = b.dataset.act;
          b.disabled = true;
          if (act === "approve") await withBusy(() => approveOne(e), "Comment approved & published.");
          if (act === "reject") await withBusy(() => rejectOne(e), "Comment rejected.");
          if (act === "delete") {
            if (!confirm("Delete this comment permanently? This removes it from the public site too.")) { b.disabled = false; return; }
            await withBusy(() => deleteOne(e), "Comment deleted.");
          }
          state.selected.delete(e._key);
        };
      });
    }

    function renderReportsPanel() {
      const panel = $("#panel");
      const open = state.reports.filter((r) => !r.resolved);
      if (state.loadingData) { panel.innerHTML = loadingState(); return; }
      if (!open.length) { panel.innerHTML = `<div class="card">${emptyState("No open reports", "Reader-flagged comments will appear here for review.")}</div>`; return; }

      panel.innerHTML = `<div style="display:grid;gap:12px">` + open.map((r) => {
        const linked = state.entries.find((e) => e.commentId === r.commentId);
        return `
        <div class="card" style="padding:18px" data-rk="${esc(r._key)}">
          <div style="display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap">
            <div style="min-width:0;flex:1">
              <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
                <span class="badge b-rejected">${icon("flag",12)} reported</span>
                <span class="muted" style="font-size:11px">${relTime(r.createdAt)}</span>
              </div>
              <div style="font-size:13px;color:var(--gray)"><strong style="color:var(--white)">Reason:</strong> ${esc(r.reason || "—")}</div>
              ${linked ? `<div class="cmt-msg" style="margin-top:10px;padding:12px;border-radius:12px;background:rgba(255,255,255,0.02);border:1px solid var(--border)"><div style="font-weight:600;color:var(--white);margin-bottom:4px">${esc(linked.userName)}</div>${esc(linked.message)}</div>` : `<div class="muted" style="font-size:12px;margin-top:8px">Comment ${esc(r.commentId)} on ${esc(r.postId)}</div>`}
              ${r.reportedBy ? `<div class="muted" style="font-size:11px;margin-top:8px">Reported by ${esc(r.reportedBy)}</div>` : ""}
            </div>
            <div style="display:flex;flex-direction:column;gap:8px">
              <button class="btn btn-rose btn-sm" data-rep="remove" data-rk="${esc(r._key)}">${icon("trash",14)} Remove comment</button>
              <button class="btn btn-ghost btn-sm" data-rep="dismiss" data-rk="${esc(r._key)}">Dismiss report</button>
            </div>
          </div>
        </div>`;
      }).join("") + `</div>`;

      root.querySelectorAll('[data-rep]').forEach((b) => {
        b.onclick = async () => {
          const r = state.reports.find((x) => x._key === b.dataset.rk); if (!r) return;
          b.disabled = true;
          if (b.dataset.rep === "remove") {
            if (!confirm("Remove the reported comment from the site and close this report?")) { b.disabled=false; return; }
            await withBusy(() => removeReportedComment(r), "Comment removed & report closed.");
          } else {
            await withBusy(() => dismissReport(r), "Report dismissed.");
          }
        };
      });
    }

    /* ---- Small view helpers --------------------------------------------- */
    function stat(n, label, color) {
      return `<div class="stat card"><div class="n" style="color:${color}">${n}</div><div class="l">${label}</div></div>`;
    }
    function statusBadge(s) {
      const st = s || "pending";
      const cls = st === "approved" ? "b-approved" : st === "rejected" ? "b-rejected" : "b-pending";
      return `<span class="badge ${cls}"><span class="dot"></span>${st}</span>`;
    }
    function typeBadge(t) { return `<span class="badge b-type">${esc(t||"—")}</span>`; }
    function checkbox(on, key) {
      return `<span class="checkbox ${on?"on":""}" data-key="${esc(key)}" role="checkbox" aria-checked="${on}" tabindex="0">${icon("check",12,"#fff")}</span>`;
    }
    function loadingState() { return `<div class="card"><div class="state"><div class="spinner"></div><p class="muted" style="margin-top:16px;font-size:13px">Loading moderation queue…</p></div></div>`; }
    function errorState(msg) { return `<div class="card"><div class="state"><div class="ic" style="color:var(--rose)">${icon("alert",22)}</div><h3 style="margin:0 0 6px">Couldn't load comments</h3><p class="muted" style="font-size:13px;max-width:380px;margin:0 auto">${esc(msg)} — confirm Firestore rules are published and you're signed in as the moderator.</p></div></div>`; }
    function emptyState(title, body) { return `<div class="state"><div class="ic">${icon("inbox",22)}</div><h3 style="margin:0 0 6px">${esc(title)}</h3><p class="muted" style="font-size:13px;max-width:340px;margin:0 auto">${esc(body)}</p></div>`; }

    /* ---- Inline icons (lucide-style strokes) ---------------------------- */
    function icon(name, size = 16, stroke = "currentColor") {
      const p = {
        shield: '<path d="M12 3l7 3v5c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/>',
        lock: '<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
        chat: '<path d="M21 12a8 8 0 0 1-11.5 7.2L4 20l1-4.5A8 8 0 1 1 21 12z"/>',
        logout: '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/>',
        check: '<path d="M5 12l4.5 4.5L19 7"/>',
        x: '<path d="M6 6l12 12M18 6L6 18"/>',
        trash: '<path d="M4 7h16M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M6 7l1 13a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-13"/>',
        reply: '<path d="M9 17l-5-5 5-5"/><path d="M4 12h11a5 5 0 0 1 5 5v1"/>',
        flag: '<path d="M5 21V4M5 4h11l-2 4 2 4H5"/>',
        reset: '<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>',
        alert: '<path d="M12 9v4M12 17h.01M10.3 4.3 2.6 18a2 2 0 0 0 1.7 3h15.4a2 2 0 0 0 1.7-3L13.7 4.3a2 2 0 0 0-3.4 0z"/>',
        inbox: '<path d="M3 12h5l2 3h4l2-3h5"/><path d="M5 5h14l2 7v6a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-6z"/>',
      }[name] || "";
      return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${stroke}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
    }
    function googleGlyph() {
      return `<svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path fill="#fff" d="M21.35 11.1H12v2.98h5.35c-.23 1.4-1.66 4.1-5.35 4.1-3.22 0-5.85-2.66-5.85-5.94S8.78 6.3 12 6.3c1.83 0 3.06.78 3.76 1.45l2.56-2.47C16.7 3.7 14.55 2.8 12 2.8 6.98 2.8 2.9 6.88 2.9 11.9S6.98 21 12 21c5.5 0 9.13-3.86 9.13-9.3 0-.62-.07-1.1-.18-1.6z"/></svg>`;
    }
  </script>
</body>
</html>
