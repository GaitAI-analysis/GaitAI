<!doctype html>
<meta charset="utf-8">
<title>GaitAI demo walker</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
<canvas id="c" width="1280" height="720"></canvas>
<script>
/*
 * A side-view walker with a kinematically consistent gait.
 *
 * The planted foot is anchored to the floor: while the heel is down the heel
 * point IS the contact, while the heel is up the toe point IS the contact, and
 * the ankle, knee and hip are solved backwards from that contact by two-link
 * inverse kinematics. The swing foot follows a smooth arc from where it left
 * the floor to where it will land, one stride ahead. The pelvis advances at
 * constant speed and rises at mid-stance / falls at double support. Nothing is
 * a translated sprite: every joint is recomputed every frame.
 */
const W = 1280, H = 720;
const FLOOR = 600;

// ── body. Proportions in px at S = 1 (leg 182 ≈ 91 cm), drawn at scale S so
//    the subject stays inside the 1280-wide frame for the whole clip.
const S = 1.08;
const L1 = 92 * S;      // thigh
const L2 = 90 * S;      // shank
const HEEL = [-9 * S, 10 * S], TOE = [23 * S, 10 * S];   // foot in ankle-local coords (flat)
const FOOT_FLAT = TOE[0] - HEEL[0];
const TORSO = 118 * S, LEAN = 4 * Math.PI / 180;
const UA = 64 * S, FA = 56 * S, HAND = 12 * S;

// ── gait
const T = 1.45;                 // one gait cycle, s (≈83 steps/min, an unhurried walk)
const STEP = 100 * S, STRIDE = 2 * STEP;
const V = STRIDE / T;           // pelvis speed, px/s
const STANCE_END = 0.62;        // toe-off
const H_MID = 190 * S, H_DROP = 11 * S;  // hip height at mid-stance (near-straight knee), and the drop at double support
const X0 = 150;                 // pelvis x at t = 0: already walking, just inside the left edge
const X1 = W - 150;             // pelvis x at the end: just inside the right edge
const LEAD = 0;                 // the clip cuts in mid-walk and cuts out mid-walk
const DURATION = LEAD + (X1 - X0) / V;

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const smooth = (s) => s * s * (3 - 2 * s);
const rad = (d) => d * Math.PI / 180;
// rotate foot-local (x,y) by pitch a: +a lifts the toe, -a lifts the heel.
const rot = ([x, y], a) => [x * Math.cos(a) + y * Math.sin(a), -x * Math.sin(a) + y * Math.cos(a)];

// piecewise cosine interpolation through (phase, value) keys, periodic in 1.
function keyed(keys) {
  return (p) => {
    p = ((p % 1) + 1) % 1;
    for (let i = 0; i < keys.length - 1; i++) {
      const [p0, v0] = keys[i], [p1, v1] = keys[i + 1];
      if (p >= p0 && p <= p1) {
        const s = (p - p0) / (p1 - p0);
        return v0 + (v1 - v0) * (1 - Math.cos(Math.PI * s)) / 2;
      }
    }
    return keys[keys.length - 1][1];
  };
}

// foot pitch over the cycle (degrees). heel strike toes-up → flat → heel rise → toe-off → swing recovery.
const pitchDeg = keyed([[0, 16], [0.09, 0], [0.42, 0], [0.52, -17], [STANCE_END, -50], [0.72, -18], [0.86, 7], [1, 16]]);

// hip height above floor: highest at mid-stance (~0.3), lowest around double support.
function hipHeight(phase) {
  return H_MID - H_DROP * (1 - Math.cos(4 * Math.PI * (phase - 0.3))) / 2;
}

// ankle position while the foot is planted at contact C (heel x when flat).
function stanceAnkle(C, phase) {
  const a = rad(pitchDeg(phase));
  if (a >= 0) { const h = rot(HEEL, a); return [C - h[0], FLOOR - h[1]]; }          // heel is the contact
  const t = rot(TOE, a); return [C + FOOT_FLAT - t[0], FLOOR - t[1]];                // toe is the contact
}

// two-link IK: hip P, ankle A → knee, thigh angle from vertical (+ forward)
function legIK(P, A) {
  let dx = A[0] - P[0], dy = A[1] - P[1];
  let d = Math.hypot(dx, dy);
  const reach = L1 + L2 - 0.6;
  let over = 0;
  if (d > reach) { over = d - reach; dx *= reach / d; dy *= reach / d; d = reach; }
  const beta = Math.atan2(dx, dy);
  const gamma = Math.acos(clamp((L1 * L1 + d * d - L2 * L2) / (2 * L1 * d), -1, 1));
  const thigh = beta + gamma;
  const K = [P[0] + L1 * Math.sin(thigh), P[1] + L1 * Math.cos(thigh)];
  const ankleAdj = [P[0] + dx, P[1] + dy];
  const shank = Math.atan2(ankleAdj[0] - K[0], ankleAdj[1] - K[1]);
  return { K, A: ankleAdj, thigh, knee: (thigh - shank), over };
}

// where a foot with cycle offset phi0 strikes for stride k
function contactX(k, phi0) {
  const tStrike = (k - phi0) * T + LEAD;
  const hipX = X0 + V * (tStrike - LEAD);
  // at heel strike the heel lands ~66 px ahead of the hip
  return hipX + 60 * S;
}

function legState(t, phi0, side) {
  const tt = Math.max(0, t - LEAD);
  const phase = ((tt / T + phi0) % 1 + 1) % 1;
  const k = Math.floor(tt / T + phi0);           // current stride index of this foot
  const hipX = X0 + V * tt;
  const hipY = FLOOR - hipHeight(phase);
  const hipDX = (side === "near" ? 3 : -3) * S * Math.sin(2 * Math.PI * phase);
  const P = [hipX + hipDX, hipY];
  let A, planted;
  if (phase <= STANCE_END) {
    A = stanceAnkle(contactX(k, phi0), phase); planted = true;
  } else {
    const s = (phase - STANCE_END) / (1 - STANCE_END);
    const A0 = stanceAnkle(contactX(k, phi0), STANCE_END);
    const A1 = stanceAnkle(contactX(k + 1, phi0), 0);
    const ex = 0.3 * s + 0.7 * smooth(s);
    const lift = 22 * S * Math.pow(Math.sin(Math.PI * s), 1.1);
    A = [A0[0] + (A1[0] - A0[0]) * ex, A0[1] + (A1[1] - A0[1]) * s - lift];
    planted = false;
  }
  const ik = legIK(P, A);
  const a = rad(pitchDeg(phase));
  const heel = [ik.A[0] + rot(HEEL, a)[0], ik.A[1] + rot(HEEL, a)[1]];
  const toe = [ik.A[0] + rot(TOE, a)[0], ik.A[1] + rot(TOE, a)[1]];
  return { P, K: ik.K, A: ik.A, heel, toe, thigh: ik.thigh, knee: ik.knee, over: ik.over, phase, planted, hipX, hipY };
}

function armState(shoulder, thighAngleSameSide) {
  const arm = -0.62 * thighAngleSameSide;                 // opposite arm to leg
  const elbow = rad(22) + rad(18) * Math.max(0, Math.sin(arm) / Math.sin(rad(30)));
  const E = [shoulder[0] + UA * Math.sin(arm), shoulder[1] + UA * Math.cos(arm)];
  const fa = arm + elbow;
  const Wr = [E[0] + FA * Math.sin(fa), E[1] + FA * Math.cos(fa)];
  const Hd = [Wr[0] + HAND * Math.sin(fa), Wr[1] + HAND * Math.cos(fa)];
  return { E, W: Wr, Hd };
}

function pose(t) {
  const near = legState(t, 0.0, "near");    // near (camera-side) leg = the subject's left leg
  const far = legState(t, 0.5, "far");
  const hip = [near.hipX, near.hipY];
  const neck = [hip[0] + TORSO * Math.sin(LEAN), hip[1] - TORSO * Math.cos(LEAN)];
  const head = [neck[0] + 3 * S, neck[1] - 30 * S];
  const shoulderNear = [neck[0] + 2 * S, neck[1] + 6 * S];
  const shoulderFar = [neck[0] - 3 * S, neck[1] + 6 * S];
  const armNear = armState(shoulderNear, near.thigh);
  const armFar = armState(shoulderFar, far.thigh);
  return { near, far, hip, neck, head, shoulderNear, shoulderFar, armNear, armFar };
}

// ── drawing
const ctx = document.getElementById("c").getContext("2d");
const C = {
  bg0: "#0a0f1c", bg1: "#0d1424", floor: "rgba(79,209,255,0.35)", grid: "rgba(148,163,184,0.07)",
  skin: "#d8a77c", skinFar: "#b8896a", hair: "#2a1f1a",
  shirt: "#3b6ea8", shirtFar: "#2c5480", trousers: "#3d4350", trousersFar: "#2e333d",
  shoe: "#1c1c22", shoeFar: "#15151a", sole: "#6b7280",
};
function seg(a, b, w, color) {
  ctx.strokeStyle = color; ctx.lineWidth = w; ctx.lineCap = "round"; ctx.lineJoin = "round";
  ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
}
function foot(leg, color, sole) {
  const { A, heel, toe } = leg;
  const pitch = Math.atan2(toe[1] - heel[1], toe[0] - heel[0]);
  const up = [Math.sin(pitch) * 9 * S, -Math.cos(pitch) * 9 * S];
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(heel[0] + up[0] * 0.2, heel[1] + up[1] * 0.2);
  ctx.lineTo(heel[0] + up[0] * 1.6, heel[1] + up[1] * 1.6);
  ctx.lineTo(A[0] + 8 * S, A[1] - 6 * S);
  ctx.lineTo(toe[0] + up[0] * 0.6, toe[1] + up[1] * 0.6);
  ctx.lineTo(toe[0], toe[1]);
  ctx.closePath(); ctx.fill();
  seg(heel, toe, 3 * S, sole);
}
function drawLeg(leg, near) {
  seg(leg.P, leg.K, (near ? 26 : 23) * S, near ? C.trousers : C.trousersFar);
  seg(leg.K, leg.A, (near ? 19 : 17) * S, near ? C.trousers : C.trousersFar);
  foot(leg, near ? C.shoe : C.shoeFar, C.sole);
}
function drawArm(sh, arm, near) {
  seg(sh, arm.E, (near ? 17 : 15) * S, near ? C.shirt : C.shirtFar);
  seg(arm.E, arm.W, (near ? 13 : 12) * S, near ? C.skin : C.skinFar);
  seg(arm.W, arm.Hd, (near ? 11 : 10) * S, near ? C.skin : C.skinFar);
}
function drawScene() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, C.bg0); g.addColorStop(1, C.bg1);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = C.grid; ctx.lineWidth = 1;
  for (let x = 0; x <= W; x += 80) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for (let y = 0; y <= H; y += 80) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  const fg = ctx.createLinearGradient(0, FLOOR, 0, H);
  fg.addColorStop(0, "rgba(79,209,255,0.06)"); fg.addColorStop(1, "rgba(79,209,255,0)");
  ctx.fillStyle = fg; ctx.fillRect(0, FLOOR, W, H - FLOOR);
  ctx.strokeStyle = C.floor; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(0, FLOOR + 0.5); ctx.lineTo(W, FLOOR + 0.5); ctx.stroke();
}
function draw(t) {
  drawScene();
  const p = pose(t);
  // far side first, then torso, then near side, then head
  drawArm(p.shoulderFar, p.armFar, false);
  drawLeg(p.far, false);
  seg(p.hip, p.neck, 36 * S, C.shirt);
  seg([p.hip[0] - 2 * S, p.hip[1] + 2 * S], [p.hip[0] + 4 * S, p.hip[1] + 2 * S], 34 * S, C.trousers);
  drawLeg(p.near, true);
  drawArm(p.shoulderNear, p.armNear, true);
  // neck and head
  seg(p.neck, [p.head[0] - 1 * S, p.head[1] + 14 * S], 12 * S, C.skin);
  ctx.fillStyle = C.skin; ctx.beginPath(); ctx.ellipse(p.head[0], p.head[1], 20 * S, 24 * S, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = C.hair; ctx.beginPath(); ctx.ellipse(p.head[0] - 3 * S, p.head[1] - 6 * S, 21 * S, 20 * S, 0, Math.PI, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(p.head[0] - 12 * S, p.head[1] + 2 * S, 9 * S, 16 * S, 0, 0, Math.PI * 2); ctx.fill();
  return p;
}

// diagnostics for one frame: contact slip, knee range, over-reach
function diag(t) {
  const p = pose(t);
  const out = {};
  for (const [name, leg] of [["near", p.near], ["far", p.far]]) {
    out[name] = { phase: +leg.phase.toFixed(3), planted: leg.planted, knee: +(leg.knee * 180 / Math.PI).toFixed(1),
      thigh: +(leg.thigh * 180 / Math.PI).toFixed(1), heel: leg.heel.map((v) => +v.toFixed(1)), toe: leg.toe.map((v) => +v.toFixed(1)), over: +leg.over.toFixed(2) };
  }
  out.hip = p.hip.map((v) => +v.toFixed(1));
  out.head = p.head.map((v) => +v.toFixed(1));
  return out;
}
window.__walker = { draw, diag, DURATION, T, V, STEP, FLOOR, LEAD, X0, W };
</script>
